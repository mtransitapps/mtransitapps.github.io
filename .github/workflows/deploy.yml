# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Inject Maps API keys and the shared Firebase configuration
      - name: Inject API Key
        env:
          MT_MAPS_JS_API_KEY: ${{ secrets.MT_MAPS_JS_API_KEY }}
          MT_REPLACE_WITH_FIREBASE_API_KEY: ${{ secrets.MT_REPLACE_WITH_FIREBASE_API_KEY }}
          MT_REPLACE_WITH_FIREBASE_APP_ID: ${{ secrets.MT_REPLACE_WITH_FIREBASE_APP_ID }}
          MT_REPLACE_WITH_FIREBASE_MEASUREMENT_ID: ${{ secrets.MT_REPLACE_WITH_FIREBASE_MEASUREMENT_ID }}
          MT_REPLACE_WITH_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.MT_REPLACE_WITH_FIREBASE_MESSAGING_SENDER_ID }}
          MT_REPLACE_WITH_FIREBASE_PROJECT_ID: ${{ secrets.MT_REPLACE_WITH_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MT_MAPS_JS_API_KEY}" ]; then
            echo "MT_MAPS_JS_API_KEY is not set" >&2
            exit 1
          fi
          if [ -z "${MT_REPLACE_WITH_FIREBASE_API_KEY}" ]; then
            echo "MT_REPLACE_WITH_FIREBASE_API_KEY is not set" >&2
            exit 1
          fi
          if [ -z "${MT_REPLACE_WITH_FIREBASE_APP_ID}" ]; then
            echo "MT_REPLACE_WITH_FIREBASE_APP_ID is not set" >&2
            exit 1
          fi
          if [ -z "${MT_REPLACE_WITH_FIREBASE_MEASUREMENT_ID}" ]; then
            echo "MT_REPLACE_WITH_FIREBASE_MEASUREMENT_ID is not set" >&2
            exit 1
          fi
          if [ -z "${MT_REPLACE_WITH_FIREBASE_PROJECT_ID}" ]; then
            echo "MT_REPLACE_WITH_FIREBASE_PROJECT_ID is not set" >&2
            exit 1
          fi
          if [ -z "${MT_REPLACE_WITH_FIREBASE_MESSAGING_SENDER_ID}" ]; then
            echo "MT_REPLACE_WITH_FIREBASE_MESSAGING_SENDER_ID is not set" >&2
            exit 1
          fi
          esc_key=$(printf '%s' "$MT_MAPS_JS_API_KEY" | sed -e 's/[\\/&]/\\\\&/g')
          sed -i "s/MT_REPLACE_WITH_MAPS_JS_API_KEY/${esc_key}/g" ./index.html
          sed -i "s/MT_REPLACE_WITH_MAPS_JS_API_KEY/${esc_key}/g" ./dev/map/empty.html
          sed -i "s/MT_REPLACE_WITH_FIREBASE_API_KEY/${MT_REPLACE_WITH_FIREBASE_API_KEY}/g" ./scripts/firebase.js
          sed -i "s/MT_REPLACE_WITH_FIREBASE_APP_ID/${MT_REPLACE_WITH_FIREBASE_APP_ID}/g" ./scripts/firebase.js
          sed -i "s/MT_REPLACE_WITH_FIREBASE_MEASUREMENT_ID/${MT_REPLACE_WITH_FIREBASE_MEASUREMENT_ID}/g" ./scripts/firebase.js
          sed -i "s/MT_REPLACE_WITH_FIREBASE_MESSAGING_SENDER_ID/${MT_REPLACE_WITH_FIREBASE_MESSAGING_SENDER_ID}/g" ./scripts/firebase.js
          sed -i "s/MT_REPLACE_WITH_FIREBASE_PROJECT_ID/${MT_REPLACE_WITH_FIREBASE_PROJECT_ID}/g" ./scripts/firebase.js


      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
