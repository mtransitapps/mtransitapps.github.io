<!DOCTYPE html>
<html>

<head>
	<title>MonTransit</title>
	<style type="text/css">
		html,
		body {
			height: 100%;
			width: 100%;
			margin: 0px;
		}
		#map {
			width: 100%;
			height: 100%;
		}
	</style>

	<!-- This APK key is restricted to 'Maps JavaScript API' on 'mtransitapps.github.io' website: -->
	<script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key=MT_REPLACE_WITH_MAPS_JS_API_KEY&libraries=maps"></script>
	<!-- Use demo key for local testing: https://developers.google.com/maps/documentation/javascript/demo-key -->
	<!-- <script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key=INSERT_DEMO_KEY_HERE&libraries=maps"></script> -->

	<script type="text/javascript">
		var DEFAULT_LAT = 45.5230433; // Montreal office
		var DEFAULT_LNG = -73.5814131; // Montreal office

		window.addEventListener('load', init);

		function init() {
			var mapOptions = {
				zoom: 17,
				center: new google.maps.LatLng(DEFAULT_LAT, DEFAULT_LNG),
				mapTypeId: 'roadmap',
				disableDefaultUI: true,
				// colorScheme: ColorScheme.DARK,
				styles: [
					{ featureType: "all", elementType: "all", stylers: [{ visibility: "off" }] },
					{ featureType: 'road', elementType: 'geometry', stylers: [{ visibility: "simplified" }, { color: '#3D2730' }] },
					{ featureType: 'water', elementType: 'geometry', stylers: [{ visibility: "simplified" }, { color: '#58454F' }] },
					{ featureType: 'landscape', elementType: 'geometry', stylers: [{ visibility: "simplified" }, { color: '#230913' }] },
				]
			};
			var mapElement = document.getElementById('map');
			var map = new google.maps.Map(mapElement, mapOptions);
		}

	</script>
</head>

<body>
	<div id="map"></div>
</body>

</html>
