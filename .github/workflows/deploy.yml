# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Pin production assets to the master commit
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import quote as quote_url, unquote, urlsplit

          root = Path.cwd()
          commit_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          cdn_prefix = "https://cdn.jsdelivr.net/gh/mtransitapps/mtransitapps.github.io@"
          cdn_base = cdn_prefix + commit_sha
          asset_extensions = {".css", ".js", ".png"}
          urls = re.compile(r"""(?<!\\)(["'])([^"'\\\s<>]+\.(?:css|js|png|json)(?:[?#][^"'\\\s<>]*)?)\1""", re.IGNORECASE)

          for source in root.rglob("*"):
              if ".git" in source.relative_to(root).parts or source.suffix not in {".html", ".js"} or not source.is_file():
                  continue

              def pin_url(match):
                  quote, url = match.groups()
                  parsed = urlsplit(url)
                  if parsed.scheme or parsed.netloc:
                      return match.group(0)
                  base = root if parsed.path.startswith("/") else source.parent
                  target = (base / unquote(parsed.path).lstrip("/")).resolve()
                  if not target.is_relative_to(root) or not target.is_file():
                      return match.group(0)
                  relative = target.relative_to(root).as_posix()
                  if target.suffix.lower() not in asset_extensions and relative != "data/modules.json":
                      return match.group(0)
                  return quote + cdn_base + "/" + quote_url(relative) + url[len(parsed.path):] + quote

              original = source.read_text()
              rewritten = urls.sub(pin_url, original.replace(cdn_prefix + "master", cdn_base))
              if rewritten != original:
                  source.write_text(rewritten)
          PY

      # Inject the API Key secret into the source file
      - name: Inject API Keys
        env:
          MT_MAPS_JS_API_KEY: ${{ secrets.MT_MAPS_JS_API_KEY }}
          MT_REPLACE_WITH_GOOGLE_SITE_VERIFICATION: ${{ secrets.MT_REPLACE_WITH_GOOGLE_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          if [ -z "${MT_MAPS_JS_API_KEY}" ]; then
            echo "MT_MAPS_JS_API_KEY is not set" >&2
            exit 1
          fi
          esc_key=$(printf '%s' "$MT_MAPS_JS_API_KEY" | sed -e 's/[\\/&]/\\\\&/g')
          sed -i "s/MT_REPLACE_WITH_MAPS_JS_API_KEY/${esc_key}/g" ./index.html
          sed -i "s/MT_REPLACE_WITH_MAPS_JS_API_KEY/${esc_key}/g" ./dev/map/empty.html
          if [ -z "${MT_REPLACE_WITH_GOOGLE_SITE_VERIFICATION}" ]; then
            echo "MT_REPLACE_WITH_GOOGLE_SITE_VERIFICATION is not set" >&2
            exit 1
          fi
          sed -i "s/MT_REPLACE_WITH_GOOGLE_SITE_VERIFICATION/$MT_REPLACE_WITH_GOOGLE_SITE_VERIFICATION/g" ./index.html


      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
