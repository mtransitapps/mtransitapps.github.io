<!DOCTYPE html>
<html>

<head>
	<title>MonTransit</title>

	<!-- icons created by https://favicon.io/ -->
	<!-- <link rel="icon" sizes="16x16 32x32 48x48" href="lo_def.ico">-->
	<!-- <link rel="icon" sizes="512x512" href="hi-res-app-icon.png"> -->
	<!-- https://raw.githubusercontent.com/mtransitapps/mtransit-for-android/master/pub/hi-res-app-icon.png -->
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

	<link rel="manifest" href="/manifest.json">

	<meta name="application-name" content="MonTransit">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<meta name="google-site-verification" content="MT_REPLACE_WITH_GOOGLE_SITE_VERIFICATION" />

	<script data-goatcounter="https://mtransitapps.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
	
	<link rel="preconnect" href="https://cdn.jsdelivr.net">
	<link rel="preconnect" href="https://maps.googleapis.com">
	<link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
	<link id="material-icons-stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null" onerror="this.dataset.loadFailed='true'">
	<noscript>
		<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">
	</noscript>
	
	<!-- Keep styles and images pinned to an immutable commit; update the hash when these files change. -->
	<!-- Current value: 28270ee78ef1b6c981fa20195d749733080d2a5d -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mtransitapps/mtransitapps.github.io@master/styles/home.css">

	<!-- Defer both scripts in order so initMap is defined before the API callback. -->
	<script defer src="https://cdn.jsdelivr.net/gh/mtransitapps/mtransitapps.github.io@master/scripts/map.js"></script>
	<!-- This APK key is restricted to 'Maps JavaScript API' on 'mtransitapps.github.io' website: -->
	<script defer src="https://maps.googleapis.com/maps/api/js?key=MT_REPLACE_WITH_MAPS_JS_API_KEY&libraries=maps,marker&loading=async&callback=initMap"></script>
	<!-- Use demo key for local testing: https://developers.google.com/maps/documentation/javascript/demo-key -->
	<!-- <script defer
		src="https://maps.googleapis.com/maps/api/js?key=INSERT_DEMO_KEY_HERE&libraries=maps,marker&loading=async&callback=initMap"></script> -->
</head>

<body>
	<div id="map"></div>
	<div class="top-left">
		<img class="logo" src="https://cdn.jsdelivr.net/gh/mtransitapps/mtransitapps.github.io@master/hi-res-app-icon.png" alt="MonTransit" />
		<span class="brand-title">MonTransit</span>
	</div>
	<div class="top-right">
		<a class="store-link" href="https://play.google.com/store/apps/details?id=org.mtransit.android" target="_blank"
			rel="noopener noreferrer" aria-label="MonTransit on the Play Store">
			<img class="store-link-logo"
				src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
				alt="Get it on Google Play" />
		</a>
		<a class="github-link" href="https://github.com/mtransitapps" target="_blank" rel="noopener noreferrer"
			aria-label="MonTransit on GitHub">
			<img class="github-logo" src="https://cdn.jsdelivr.net/gh/mtransitapps/mtransitapps.github.io@master/img/gitHub_invertocat_white_clearspace.png" alt="GitHub" />
		</a>
	</div>
	<button id="my-location-btn" class="my-location-btn" type="button" aria-label="Use my location" title="Use my location">
		<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
			<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A9 9 0 0 0 13 3.06V1h-2v2.06A9 9 0 0 0 3.06 11H1v2h2.06A9 9 0 0 0 11 20.94V23h2v-2.06A9 9 0 0 0 20.94 13H23v-2zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z" />
		</svg>
	</button>
</body>

</html>
