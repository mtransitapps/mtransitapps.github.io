<!DOCTYPE html>
<html>
	<head>
		<title>MonTransit Build status</title>
		<link rel="icon" sizes="512x512" href="../../hi-res-app-icon.png">
		<style type="text/css">
			.icon {
				height: 13px;
				width: 13px;
				padding-right: 3px;
				padding-left: 3px;
			}
			table, th, td {
				border: 1px solid black;
				border-collapse: collapse;
			}
			td {
				vertical-align: top;
			}
		</style>
		<script type="text/javascript">
			function sleep(ms) {
				return new Promise(resolve => setTimeout(resolve, ms));
			}
			window.onload = async function() {
				var projects = [
					"mtransit-for-android"
				];
				var pkgs = [
					"org.mtransit.android"
				];
				try {
					if (window.location.protocol === "file:") {
						throw new Error("Loading modules.json from file:// is blocked by browser security. Open this page via http(s), e.g. a local web server.");
					}
					const modulesRes = await fetch("../../data/modules.json");
					if (!modulesRes.ok) {
						throw new Error("HTTP " + modulesRes.status + " while loading modules.json");
					}
					const modules = await modulesRes.json();
					for (const moduleEntry of modules) {
						if (!moduleEntry || !moduleEntry.repo || !moduleEntry.pkg) {
							continue;
						}
						let project = moduleEntry.repo;
						if (project.endsWith("-android")) {
							project = project.substring(0, project.length - "-android".length);
						}
						projects.push(project);
						pkgs.push(moduleEntry.pkg);
					}
				} catch (error) {
					console.error("Unable to load modules list:", error);
				}
				var branches = [
					"master",
					"mmathieum"
				];
				const urlParams = new URLSearchParams(window.location.search);
				if (urlParams.has('branches')) {
					branches = urlParams.get('branches').split(",")
				}
				var ciProviders = [
					"circleci",
					// "travis",
					"github",
					// "gitlab",
					// "bitise"
				];
				if (urlParams.has('ci')) {
					ciProviders = urlParams.get('ci').split(",")
				}
				var projectsTable = document.getElementById("projects-table");
				var tableHead = projectsTable.createTHead();
				var tableHeadRow = tableHead.insertRow();
				var tableHeadRowCell = tableHeadRow.insertCell();
				tableHeadRowCell.innerHTML = "Project";
				var tableHeadRowCell = tableHeadRow.insertCell();
				tableHeadRowCell.innerHTML = "Links";
				var tableHeadRowCell = tableHeadRow.insertCell();
				tableHeadRowCell.innerHTML = "Branch";
				if (ciProviders.includes("circleci")) {
					var tableHeadRowCell = tableHeadRow.insertCell();
					tableHeadRowCell.innerHTML = "CircleCI";
				}
				if (ciProviders.includes("travis")) {
					var tableHeadRowCell = tableHeadRow.insertCell();
					tableHeadRowCell.innerHTML = "Travis CI";
				}
				if (ciProviders.includes("github")) {
					var tableHeadRowCell = tableHeadRow.insertCell();
					tableHeadRowCell.innerHTML = "GitHub Actions";
				}
				if (ciProviders.includes("gitlab")) {
					var tableHeadRowCell = tableHeadRow.insertCell();
					tableHeadRowCell.innerHTML = "GitLab CI";
				}
				if (ciProviders.includes("bitrise")) {
					var tableHeadRowCell = tableHeadRow.insertCell();
					tableHeadRowCell.innerHTML = "Bitrise";
				}
				const makeGHBadge = (projectUrl, branch, workflowName, workflowFileName) => {
					const encodedBranch = encodeURIComponent(branch);
					const encodedWorkflowName = encodeURIComponent(workflowName);
					const htmlWorkflowName = workflowName.replace(/&/g, '&amp;');
					return "<a href=\"https://github.com/mtransitapps/" + projectUrl + "/actions?query=branch:" + encodedBranch + "+workflow:%22" + encodedWorkflowName + "%22\" rel=\"nofollow\">"
						+ "<img alt=\"GH:" + htmlWorkflowName + "\" src=\"https://github.com/mtransitapps/" + projectUrl + "/actions/workflows/" + workflowFileName + "/badge.svg?branch=" + encodedBranch + "\">"
						+ "</a>";
				};
				var size = Math.min(projects.length, pkgs.length);
				var tableBody = projectsTable.createTBody();
				for (p = 0; p < size; p++) {
					var project = projects[p];
					var pkg = pkgs[p];
					var projectUrl = project;
					if (!projectUrl.endsWith("-android")) {
						projectUrl = projectUrl + "-android";
					}
					for (b = 0; b < branches.length; b++) {
						var branch = branches[b];
						var row = tableBody.insertRow(); // append at the bottom
						var c = 0;
						if (b == 0) {
							var cellProjectNameWithIcon = row.insertCell(c);
							cellProjectNameWithIcon.rowSpan = ""+branches.length+"";
							cellProjectNameWithIcon.innerHTML =
								"<img class=\"icon\" src=\"https://raw.githubusercontent.com/mtransitapps/"+projectUrl+"/"+branch+"/app-android/src/main/play/listings/en-US/graphics/icon/1.png\">"
								+ project;
							c++;
							var cellLinks = row.insertCell(c);
							cellLinks.rowSpan = ""+branches.length+"";
							cellLinks.innerHTML = "";
							cellLinks.innerHTML += ""
								+ "<a title=\"Git repository\" href=\"https://github.com/mtransitapps/"+projectUrl+"/\" rel=\"nofollow\">"
									// + "📁"
									+ "<img class=\"icon\" alt=\"[R]\" src=\"https://git-scm.com/images/logos/downloads/Git-Icon-1788C.png\" />"
								+ "</a>";
							if (ciProviders.includes("circleci")) {
								cellLinks.innerHTML += ""
									+ "<a title=\"CircleCI\" href=\"https://circleci.com/gh/mtransitapps/"+projectUrl+"/\" rel=\"nofollow\">"
										+ "<img class=\"icon\" alt=\"[C]\" src=\"https://img.icons8.com/?size=13&id=ep4D1m8k13qZ&format=png\" />"
									+ "</a>";
							}
							if (ciProviders.includes("travis")) {
								cellLinks.innerHTML += ""
									+ "<a title=\"Travis CI\"  href=\"https://travis-ci.com/mtransitapps/"+projectUrl+"/\" rel=\"nofollow\">"
										+ "[T]"
									+ "</a>";
							}
							if (ciProviders.includes("github")) {
								cellLinks.innerHTML += ""
									+ "<a title=\"GitHub Actions\"  href=\"https://github.com/mtransitapps/"+projectUrl+"/actions\" rel=\"nofollow\">"
										// https://github.githubassets.com/favicons/favicon.png
										+ "<img class=\"icon\" alt=\"[G]\" src=\"https://github.githubassets.com/assets/actions-icon-actions-61925a4b8822.svg\" />"
									+ "</a>";
							}
							cellLinks.innerHTML += ""
								+ "<a title=\"BETA testing\"  href=\"https://play.google.com/apps/testing/"+pkg+"\" rel=\"nofollow\">"
									// + "[B]"
									// + "&#946;"
									+ "<img class=\"icon\" alt=\"[B]\" src=\"https://www.gstatic.com/play-apps-publisher/play_console_favicon.png\" />"
								+ "</a>";
							cellLinks.innerHTML += ""
								+ "<a title=\"Google Play Store\" href=\"https://play.google.com/store/apps/details?id="+pkg+"\" rel=\"nofollow\">"
									// + "[S]"
									+ "<img class=\"icon\" alt=\"[S]\" src=\"https://www.gstatic.com/android/market_images/web/favicon_v3.ico\" />"
								+ "</a>";
							c++;
						}
						var cellBranchName = row.insertCell(c++);
						cellBranchName.innerHTML = ""
								+ "<a title=\"GitHub Gradle project branch\" href=\"https://github.com/mtransitapps/"+projectUrl+"/tree/"+branch+"\" rel=\"nofollow\">"
									+ branch
								+ "</a>";
						if (ciProviders.includes("circleci")) {
							var cellCircleCI = row.insertCell(c++);
							cellCircleCI.innerHTML =
								"<a href=\"https://circleci.com/gh/mtransitapps/"+projectUrl+"/tree/"+branch+"\" rel=\"nofollow\">"
									+ "<img alt=\"CircleCI\""
										+ "src=\"https://circleci.com/gh/mtransitapps/"+projectUrl+"/tree/"+branch+".svg?style=svg\">"
								+ "</a>";
						}
						if (ciProviders.includes("travis")) {
							var cellTravisCI = row.insertCell(c++);
							cellTravisCI.innerHTML =
								"<a href=\"https://travis-ci.com/mtransitapps/"+projectUrl+"/\" rel=\"nofollow\">"
									+ "<img alt=\"Travis CI\""
										+ "src=\"https://api.travis-ci.com/mtransitapps/"+projectUrl+".svg?branch="+branch+"\">"
								+ "</a>";
						}
						if (ciProviders.includes("github")) {
							var cellGitHubAction = row.insertCell(c++);
							var ghBadgesHTML = "";
							if (project == "mtransit-for-android") {
								ghBadgesHTML += makeGHBadge(projectUrl, branch, "MT build", "mt-build.yml");
								// if (branch == "mmathieum") {
								// 	ghBadgesHTML += makeGHBadge(projectUrl, branch, "MT dependency update", "mt-dependency-update.yml");
								// }
							}
							if (project != "mtransit-for-android") {
								ghBadgesHTML += makeGHBadge(projectUrl, branch, "MT sync code & data", "mt-sync-code-data.yml");
							}
							if (project != "mtransit-for-android" && !project.endsWith("-bike")) {
								ghBadgesHTML += makeGHBadge(projectUrl, branch, "MT download data", "mt-download-data.yml");
							}
							ghBadgesHTML += makeGHBadge(projectUrl, branch, "MT release", "mt-release.yml");
							cellGitHubAction.innerHTML = ghBadgesHTML;
						}
						if (ciProviders.includes("gitlab")) {
							var cellGitLab = row.insertCell(c++);
							if (project == "mtransit-for-android") {
								cellGitLab.innerHTML =
									"<a href=\"https://gitlab.com/mtransitapps/"+projectUrl+"/pipelines\" rel=\"nofollow\">"
										+ "<img alt=\"GitLab\""
											+ "src=\"https://gitlab.com/mtransitapps/"+projectUrl+"/badges/"+branch+"/pipeline.svg\">"
									+ "</a>";
							} else {
								cellGitLab.innerHTML = "<!-- TODO GitLab -->";
							}
						}
						if (ciProviders.includes("bitrise")) {
							var cellBitrise = row.insertCell(c++);
							if (project == "mtransit-for-android") {
								cellBitrise.innerHTML =
									"<a href=\"https://app.bitrise.io/app/16352774a3da9a41\" rel=\"nofollow\">"
										+ "<img alt=\"Bitrise\""
											+ "src=\"https://app.bitrise.io/app/16352774a3da9a41/status.svg?token=Ue0WAJU3awNJm80pty5K_g&branch="+branch+"\">"
									+ "</a>";
							} else {
								cellBitrise.innerHTML = "<!-- TODO Bitrise -->";
							}
						}
					}
					if (ciProviders.includes("circleci")) {
						await sleep(77); // wait for 0.033 seconds #CircleCI
					}
				}
				for (p = 0; p < size; p++) {
					document.body.innerHTML += "<BR />";
				}
			};
		</script>
	</head>
	<body>
		<h2>MonTransit Build status</h2>

		<table id="projects-table">
			<!-- Filled with JavaScript -->
		</table>
	</body>
</html>
